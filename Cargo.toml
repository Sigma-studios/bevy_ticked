[package]
name = "bevy_ticked"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/bevy_ticked_networking",
    "crates/bevy_ticked_networking_ensemble",
    "crates/bevy_ticked_lockstep_networking",
]

# bevy_ensemble is pinned here, once, by commit. Every crate in this workspace takes it with
# `workspace = true`, so bumping the transport is one edit and one `cargo update -p bevy_ensemble`
# rather than a hunt through six manifests and a lock file that had quietly fallen nine commits
# behind the branch they all named.
[workspace.dependencies]
bevy_ensemble = { git = "https://github.com/Sigma-studios/bevy_ensemble", rev = "4880d0b" }
bevy_ensemble_webrtc = { git = "https://github.com/Sigma-studios/bevy_ensemble", rev = "4880d0b" }
bevy_ensemble_steam = { git = "https://github.com/Sigma-studios/bevy_ensemble", rev = "4880d0b" }
bevy_ensemble_loopback = { git = "https://github.com/Sigma-studios/bevy_ensemble", rev = "4880d0b" }

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "bevy_log"] }
serde = { version = "1", features = ["derive"] }
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[dev-dependencies]
# The tests and examples run whole apps; the library itself only needs the ECS.
bevy = "0.19"
avian3d = "0.7"

[[example]]
name = "bouncing_ball"
path = "examples/bouncing_ball.rs"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
