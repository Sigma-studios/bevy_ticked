[package]
name = "bevy_ticked_lockstep_networking"
version = "0.1.0"
edition = "2024"

[features]
default = ["transport-webrtc"]
transport-webrtc = ["bevy_ensemble_webrtc"]
transport-steam = ["bevy_ensemble_steam"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "bevy_log"] }
bevy_ticked = { path = "../.." }
bevy_ensemble = { workspace = true }
bevy_ensemble_webrtc = { workspace = true, optional = true }
bevy_ensemble_steam = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The tests and examples run whole apps; the library itself only needs the ECS.
bevy = "0.19"
avian2d = { version = "0.7", features = ["serialize"] }
# Two peers in one process, over a link that can be told to drop and reorder. The checksum
# exchange is the one thing here whose bug was that it was never run against a wire.
bevy_ensemble_loopback = { workspace = true }
# The source guard and golden helpers; tests only.
bevy_ticked_testing = { path = "../bevy_ticked_testing" }

[[example]]
name = "block_placer"
path = "examples/block_placer.rs"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
