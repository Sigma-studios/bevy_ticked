[package]
name = "bevy_ticked_lockstep_networking"
version = "0.1.0"
edition = "2024"

[features]
default = ["transport-webrtc"]
transport-webrtc = ["bevy_ensemble_webrtc"]
transport-steam = ["bevy_ensemble_steam"]

[dependencies]
bevy = "0.19"
bevy_ticked = { path = "../.." }
bevy_ensemble = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master" }
bevy_ensemble_webrtc = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master", optional = true }
bevy_ensemble_steam = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master", optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
avian2d = { version = "0.7", features = ["serialize"] }
# Two peers in one process, over a link that can be told to drop and reorder. The checksum
# exchange is the one thing here whose bug was that it was never run against a wire.
bevy_ensemble_loopback = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "master" }

[[example]]
name = "block_placer"
path = "examples/block_placer.rs"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
