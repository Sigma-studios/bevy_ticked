[package]
name = "bevy_ticked_networking_ensemble"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
bevy_ticked = { path = "../.." }
bevy_ticked_networking = { path = "../bevy_ticked_networking" }
bevy_ensemble = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "feature/netdebug-extras" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
avian2d = { version = "0.7", features = ["serialize"] }
avian3d = { version = "0.7", features = ["serialize"] }
bevy_ensemble_webrtc = { git = "https://github.com/Sigma-studios/bevy_ensemble", branch = "feature/netdebug-extras" }
bevy_elan = { git = "https://github.com/Sigma-dev/bevy_elan", branch = "master", features = ["serialize"] }

[[example]]
name = "top_down_shooter"
path = "examples/top_down_shooter.rs"

[[example]]
name = "fps_shooter"
path = "examples/fps_shooter.rs"
