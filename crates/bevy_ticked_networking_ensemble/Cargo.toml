[package]
name = "bevy_ticked_networking_ensemble"
version = "0.1.0"
edition = "2024"

[features]
default = ["overlay"]
# Publishes the simulation's counters (tick cost, replays, snapshot bytes) to bevy_ensemble's
# net-debug overlay under `ticked.*`.
overlay = ["bevy_ensemble/netdebug"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "bevy_log"] }
bevy_ticked = { path = "../.." }
bevy_ticked_networking = { path = "../bevy_ticked_networking" }
bevy_ensemble = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The tests and examples run whole apps; the library itself only needs the ECS.
bevy = "0.19"
avian2d = { version = "0.7", features = ["serialize"] }
avian3d = { version = "0.7", features = ["serialize"] }
bevy_ensemble_webrtc = { workspace = true }
bevy_ticked_avian = { path = "../bevy_ticked_avian", features = ["2d", "3d"] }
bevy_elan = { git = "https://github.com/Sigma-dev/bevy_elan", rev = "fb453b3", features = ["serialize"] }
# The source guard and golden helpers; tests only.
bevy_ticked_testing = { path = "../bevy_ticked_testing" }

[[example]]
name = "top_down_shooter"
path = "examples/top_down_shooter.rs"

[[example]]
name = "fps_shooter"
path = "examples/fps_shooter.rs"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
